name: Tag and release

# On every merged PR into master: compute the next version from the
# conventional commits since the last tag, push the tag and run the release.
#
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the
# release workflow is called directly instead of relying on its tag trigger.
#
# Bump rules (prefix vimtmpl-):
#   type!: ... or "BREAKING CHANGE:" in a body  -> major
#   feat: ...                                    -> minor
#   anything else                                -> patch
# Add the label "skip-release" to a PR to merge it without releasing.

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tag-and-release
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'skip-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if git describe --exact-match --tags --match 'vimtmpl-*' HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged, nothing to do"
            exit 0
          fi

          last="$(git describe --tags --abbrev=0 --match 'vimtmpl-*' HEAD 2>/dev/null || true)"
          if [[ -n "${last}" ]]; then
            range="${last}..HEAD"
            current="${last#vimtmpl-}"
          else
            range="HEAD"
            current="0.0.0"
          fi
          IFS=. read -r major minor patch <<<"${current}"

          subjects="$(git log --no-merges --format=%s "${range}"; printf '%s\n' "${PR_TITLE}")"
          bodies="$(git log --no-merges --format=%b "${range}")"

          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"${subjects}" ||
             grep -qE '^BREAKING[ -]CHANGE:' <<<"${bodies}"; then
            bump="major"; major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<<"${subjects}"; then
            bump="minor"; minor=$((minor + 1)); patch=0
          else
            bump="patch"; patch=$((patch + 1))
          fi

          tag="vimtmpl-${major}.${minor}.${patch}"
          echo "${last:-<none>} -> ${tag} (${bump})"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

      - name: Push tag
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
