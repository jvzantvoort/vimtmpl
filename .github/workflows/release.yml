name: Release

on:
  push:
    tags:
      - 'vimtmpl-*'
  workflow_call:
    inputs:
      tag:
        description: Tag to build and release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and release, e.g. vimtmpl-2.4.0
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          ./build.sh buildr ${{ matrix.goos }} ${{ matrix.goarch }} "$GITHUB_WORKSPACE/build"

      - name: Create package
        run: |
          PACKAGE_NAME="vimtmpl-${TAG#vimtmpl-}.${{ matrix.goos }}.${{ matrix.goarch }}.tar.gz"
          mkdir -p dist
          tar -czvf "dist/${PACKAGE_NAME}" -C "build/${{ matrix.goos }}.${{ matrix.goarch }}" .
          (cd dist && sha256sum "${PACKAGE_NAME}" >"${PACKAGE_NAME}.sha256")

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Compose release notes
        run: |
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PKG="vimtmpl-${TAG#vimtmpl-}.linux.amd64.tar.gz"
          cat >notes.md <<EOF
          ## Download

          **Linux amd64:** [${PKG}](${URL}/${PKG}) ([sha256](${URL}/${PKG}.sha256))

          \`\`\`sh
          curl -fsSLO ${URL}/${PKG}
          \`\`\`
          EOF
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
